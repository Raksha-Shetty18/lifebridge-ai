services:
  - type: web
    name: lifebridge-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    rootDir: server
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
